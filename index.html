<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>برا السالفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070f;
  --s1:#0f0f1c;
  --s2:#16162a;
  --s3:#1e1e35;
  --gold:#f5c842;
  --orange:#ff6b35;
  --purple:#9b6dff;
  --teal:#2dd4bf;
  --red:#ef4444;
  --text:#ece9ff;
  --t2:rgba(236,233,255,.55);
  --t3:rgba(236,233,255,.22);
  --r:16px;--r2:24px;--r3:32px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;justify-content:center;
  overflow-x:hidden;
}

/* BACKGROUND */
#bg-canvas{position:fixed;inset:0;z-index:0;opacity:.6;}
.noise-layer{
  position:fixed;inset:0;z-index:1;
  opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events:none;
}

/* WRAP */
.wrap{
  position:relative;z-index:2;
  width:100%;max-width:500px;
  padding:20px 14px 60px;
  display:flex;flex-direction:column;gap:0;
}

/* SCREEN ANIM */
.screen{animation:sIn .42s cubic-bezier(.34,1.45,.64,1);}
@keyframes sIn{from{opacity:0;transform:translateY(22px) scale(.97);}to{opacity:1;transform:none;}}

/* GLASS CARD */
.card{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r3);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  padding:28px 22px;
  position:relative;overflow:hidden;
}
.card::after{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
}

/* HEADER */
.logo-wrap{text-align:center;padding:8px 0 28px;}
.logo-emoji{
  font-size:64px;display:block;margin-bottom:10px;
  filter:drop-shadow(0 0 28px rgba(245,200,66,.45));
  animation:levitate 3.5s ease-in-out infinite;
}
@keyframes levitate{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.logo-title{
  font-size:38px;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(130deg,var(--gold) 0%,var(--orange) 60%,#ff3cac 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;
}
.logo-sub{font-size:13px;color:var(--t2);margin-top:6px;font-weight:400;letter-spacing:.03em;}

/* SECTION LABEL */
.slabel{
  font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;color:var(--t3);margin-bottom:10px;
}

/* STEPPER */
.stepper-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.stepper-box{background:var(--s2);border:1px solid rgba(255,255,255,.07);border-radius:var(--r2);padding:14px 12px;}
.stepper-box .slabel{margin-bottom:8px;}
.stepper-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.step-btn{
  width:38px;height:38px;border-radius:10px;border:none;
  background:rgba(255,255,255,.07);color:var(--text);
  font-size:20px;cursor:pointer;transition:background .15s,transform .1s;
  font-family:'Tajawal',sans-serif;display:flex;align-items:center;justify-content:center;
}
.step-btn:hover{background:rgba(255,255,255,.13);}
.step-btn:active{transform:scale(.9);}
.step-val{font-size:24px;font-weight:900;color:var(--text);min-width:28px;text-align:center;}

/* CATEGORY */
.cat-scroll{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;margin-bottom:18px;
}
.cat-btn{
  padding:10px 6px;border-radius:14px;
  border:1px solid rgba(255,255,255,.07);
  background:var(--s2);
  color:var(--t2);font-size:13px;font-weight:600;
  font-family:'Tajawal',sans-serif;cursor:pointer;
  transition:all .2s;text-align:center;line-height:1.5;
}
.cat-btn:hover{background:var(--s3);color:var(--text);}
.cat-btn.active{
  background:rgba(155,109,255,.2);
  border-color:var(--purple);color:var(--text);
  box-shadow:0 0 16px rgba(155,109,255,.2);
}

/* BIG BUTTON */
.btn{
  width:100%;padding:16px;border:none;border-radius:18px;
  font-size:19px;font-weight:800;font-family:'Tajawal',sans-serif;
  cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .15s;
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(rgba(255,255,255,.12),transparent);
  border-radius:inherit;pointer-events:none;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:scale(.97);opacity:.9;}
.btn-primary{
  background:linear-gradient(135deg,#6c3bcc,#9b6dff 50%,#2dd4bf);
  color:#fff;box-shadow:0 6px 28px rgba(155,109,255,.35);margin-top:18px;
}
.btn-primary:hover{box-shadow:0 10px 36px rgba(155,109,255,.5);}
.btn-gold{
  background:linear-gradient(135deg,#b8860b,#f5c842 50%,#ffed8a);
  color:#1a1000;box-shadow:0 6px 24px rgba(245,200,66,.3);margin-top:12px;
}
.btn-danger{
  background:linear-gradient(135deg,#991b1b,#ef4444);
  color:#fff;box-shadow:0 6px 24px rgba(239,68,68,.3);margin-top:12px;
}
.btn-ghost{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  color:var(--t2);font-size:15px;margin-top:8px;
}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:var(--text);}

/* PILL BADGE */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
}
.pill-purple{background:rgba(155,109,255,.15);border:1px solid rgba(155,109,255,.3);color:var(--purple);}
.pill-gold{background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.28);color:var(--gold);}
.pill-teal{background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.28);color:var(--teal);}

/* PROGRESS */
.prog-wrap{margin-bottom:20px;}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:7px;font-weight:700;}
.prog-track{height:5px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--teal));transition:width .5s cubic-bezier(.34,1.45,.64,1);}

/* PLAYER SCREEN */
.player-tag{text-align:center;margin-bottom:6px;}
.player-num{font-size:48px;font-weight:900;text-align:center;line-height:1;margin-bottom:24px;}

.reveal-card{
  height:210px;border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;cursor:pointer;user-select:none;
  transition:transform .15s;position:relative;overflow:hidden;
  margin:4px 0 24px;
}
.reveal-card:active{transform:scale(.96);}

.rc-hidden{
  background:var(--s2);
  border:2px dashed rgba(255,255,255,.14);
}
.rc-hidden .rch-icon{font-size:44px;animation:tap 2s ease-in-out infinite;}
@keyframes tap{0%,100%{transform:scale(1) translateY(0);}40%{transform:scale(1.15) translateY(-4px);}60%{transform:scale(.95) translateY(2px);}}
.rc-hidden .rch-text{font-size:16px;color:var(--t2);font-weight:500;}
.rc-hidden .rch-sub{font-size:12px;color:var(--t3);}

.rc-shown{
  background:linear-gradient(145deg,#1a0d40,#0d2a38,#0a1a2e);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}
.rc-shown::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 25% 25%,rgba(155,109,255,.2),transparent 55%),
             radial-gradient(circle at 75% 75%,rgba(45,212,191,.15),transparent 55%);
}
.rc-shown .rcs-lbl{position:relative;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--teal);opacity:.75;}
.rc-shown .rcs-word{position:relative;font-size:48px;font-weight:900;letter-spacing:-1px;animation:wordBounce .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes wordBounce{from{transform:scale(.4) rotate(-5deg);opacity:0;}to{transform:none;opacity:1;}}
.rc-shown .rcs-hint{position:relative;font-size:11px;color:var(--t2);}

/* OUTSIDER badge inside word card */
.outsider-glow{
  position:absolute;inset:0;
  background:radial-gradient(circle at 70% 30%,rgba(239,68,68,.12),transparent 60%);
  pointer-events:none;
}

/* TIMER */
.timer-section{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;}
.timer-svg-wrap{position:relative;width:130px;height:130px;}
.timer-svg-wrap svg{transform:rotate(-90deg);}
.timer-inner{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.timer-num{font-size:36px;font-weight:900;line-height:1;}
.timer-lbl{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}

/* HINTS */
.hints-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 18px;}
.hint-item{
  padding:11px 10px;border-radius:13px;
  border:1px solid rgba(255,255,255,.08);
  background:var(--s2);
  font-size:13px;color:var(--t2);
  cursor:pointer;transition:all .2s;
  font-family:'Tajawal',sans-serif;text-align:center;
}
.hint-item:hover{background:var(--s3);color:var(--text);}
.hint-item.used{
  background:rgba(45,212,191,.07);
  border-color:rgba(45,212,191,.2);
  color:rgba(45,212,191,.5);
  text-decoration:line-through;pointer-events:none;
}

/* DISCUSSION HEADER */
.disc-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
}

/* REVEAL */
.outsider-reveal{
  display:flex;align-items:center;gap:12px;
  padding:16px;border-radius:18px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);
  margin-bottom:10px;animation:sIn .4s ease;
}
.or-avatar{
  width:50px;height:50px;border-radius:14px;flex-shrink:0;
  background:rgba(239,68,68,.18);display:flex;align-items:center;justify-content:center;font-size:22px;
}
.or-name{font-size:19px;font-weight:800;}
.or-sub{font-size:12px;color:rgba(255,110,110,.65);margin-top:2px;}

.words-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.word-box{border-radius:16px;padding:16px 10px;text-align:center;}
.wb-n{background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.22);}
.wb-o{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);}
.wb-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.wb-n .wb-lbl{color:var(--teal);}
.wb-o .wb-lbl{color:#f87171;}
.wb-val{font-size:24px;font-weight:900;}
.wb-n .wb-val{color:var(--teal);}
.wb-o .wb-val{color:#f87171;}

.vote-section{
  background:var(--s2);border:1px solid rgba(255,255,255,.07);
  border-radius:18px;padding:16px;margin:14px 0;
}
.vote-title{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:12px;text-align:center;}
.vote-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.vote-btn{
  padding:8px 16px;border-radius:12px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.05);
  color:var(--t2);font-size:14px;font-weight:600;
  font-family:'Tajawal',sans-serif;cursor:pointer;transition:all .2s;
}
.vote-btn:hover{background:rgba(255,255,255,.1);color:var(--text);}
.vote-btn.on{background:rgba(245,200,66,.15);border-color:rgba(245,200,66,.4);color:var(--gold);}

.info-box{
  background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.14);
  border-radius:12px;padding:12px 14px;font-size:12px;
  color:rgba(45,212,191,.75);line-height:1.9;margin:12px 0;
}

/* SCOREBOARD */
.score-list{margin:16px 0;display:flex;flex-direction:column;gap:8px;}
.score-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:16px;
  background:var(--s2);border:1px solid rgba(255,255,255,.06);
  transition:all .3s;
}
.score-row.r1{
  background:rgba(245,200,66,.08);border-color:rgba(245,200,66,.22);
}
.s-rank{font-size:22px;width:30px;text-align:center;flex-shrink:0;}
.s-name{flex:1;font-size:15px;font-weight:700;}
.s-pts{
  padding:5px 14px;border-radius:99px;
  font-size:14px;font-weight:900;
  background:rgba(255,255,255,.08);color:var(--gold);
}
.score-row.r1 .s-pts{background:rgba(245,200,66,.18);}

/* WINNER */
.winner-card{
  text-align:center;padding:28px 20px;border-radius:22px;
  background:linear-gradient(135deg,rgba(245,200,66,.08),rgba(255,107,53,.06));
  border:1px solid rgba(245,200,66,.18);margin-bottom:18px;
  animation:sIn .5s cubic-bezier(.34,1.45,.64,1);
}
.w-crown{font-size:56px;display:block;margin-bottom:8px;animation:levitate 2.5s ease-in-out infinite;}
.w-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);}
.w-name{font-size:38px;font-weight:900;color:var(--gold);margin:4px 0 2px;line-height:1;}
.w-pts{font-size:15px;color:var(--t2);}

/* CONFETTI DOTS */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
.dot{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0;}

/* DIVIDER */
.hr{height:1px;background:rgba(255,255,255,.06);margin:18px 0;}

/* FOOTER */
.footer{
  text-align:center;padding:28px 0 8px;
  font-size:12px;color:var(--t3);line-height:2;
}
.footer a{color:var(--t2);text-decoration:none;}
.footer .copy-brand{
  font-size:14px;font-weight:700;color:var(--t2);
  background:linear-gradient(90deg,var(--purple),var(--teal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* MISC */
.tc{text-align:center;}
.mb4{margin-bottom:4px;}
.mb8{margin-bottom:8px;}
.mb16{margin-bottom:16px;}
.mb20{margin-bottom:20px;}
.mt8{margin-top:8px;}
.mt12{margin-top:12px;}
.w100{width:100%;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
</style>
</head>

<div class="noise-layer"></div>
<div class="wrap">
  <div id="app"></div>
  <footer class="footer">
    <div class="copy-brand">🎭 برا السالفة</div>

    <div>جميع الحقوق محفوظة © aood99ad❤️2026</div>

</div>

<div class="confetti-wrap" id="confetti"></div>

   ANIMATED BACKGROUND
══════════════════════════════════════ */
(function(){
  const canvas=document.getElementById('bg-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,orbs=[];
  const ORBS=[
    {x:.15,y:.15,r:320,c:'#4a1d96',sp:.0003},
    {x:.82,y:.75,r:280,c:'#0e4a4a',sp:.0005},
    {x:.5,y:.5,r:220,c:'#2d1b69',sp:.0004},
    {x:.7,y:.15,r:180,c:'#1a3a0a',sp:.0006},
    {x:.25,y:.8,r:200,c:'#4a1a00',sp:.0003},
  ];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  let t=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    ORBS.forEach((o,i)=>{
      const ox=o.x*W+Math.sin(t*o.sp*W+i)*80;
      const oy=o.y*H+Math.cos(t*o.sp*H+i*1.3)*60;
      const g=ctx.createRadialGradient(ox,oy,0,ox,oy,o.r);
      g.addColorStop(0,o.c+'aa');g.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(ox,oy,o.r,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
    t++;requestAnimationFrame(draw);
  }
  draw();
})();

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let S={
  screen:'setup',players:5,outsiders:1,rounds:3,timerSec:90,
  category:Object.keys(CATS)[0],round:1,scores:{},
  playerWords:[],outsiderIdxs:[],cur:0,revealed:false,
  normalWord:'',outsiderWord:'',timerRef:null,
};

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function $id(id){return document.getElementById(id);}
function render(html){$id('app').innerHTML=`<div class="screen">${html}</div>`;}

/* ══════════════════════════════════════
   SETUP SCREEN
══════════════════════════════════════ */
function showSetup(){
  S.screen='setup';
  const catsHtml=Object.keys(CATS).map(c=>
    `<button class="cat-btn ${c===S.category?'active':''}" onclick="pickCat(this,'${c.replace(/'/g,"\\'")}'')">${c}</button>`
  ).join('');
  render(`
    <div class="card">
      <div class="logo-wrap">
        <span class="logo-emoji">🎭</span>
        <div class="logo-title">برا السالفة</div>
        <div class="logo-sub">لعبة التجسس والكشف الاجتماعي</div>
      </div>

      <div class="slabel">الإعدادات</div>
      <div class="stepper-grid">
        <div class="stepper-box">
          <div class="slabel">اللاعبين</div>
          <div class="stepper-row">
            <button class="step-btn" onclick="step('players',-1,3,20)">−</button>
            <span class="step-val" id="v-players">${S.players}</span>
            <button class="step-btn" onclick="step('players',1,3,20)">+</button>
          </div>
        </div>
        <div class="stepper-box">
          <div class="slabel">المختلفين</div>
          <div class="stepper-row">
            <button class="step-btn" onclick="step('outsiders',-1,1,4)">−</button>
            <span class="step-val" id="v-outsiders">${S.outsiders}</span>
            <button class="step-btn" onclick="step('outsiders',1,1,4)">+</button>
          </div>
        </div>
        <div class="stepper-box">
          <div class="slabel">الجولات</div>
          <div class="stepper-row">
            <button class="step-btn" onclick="step('rounds',-1,1,10)">−</button>
            <span class="step-val" id="v-rounds">${S.rounds}</span>
            <button class="step-btn" onclick="step('rounds',1,1,10)">+</button>
          </div>
        </div>
        <div class="stepper-box">
          <div class="slabel">الوقت (ث)</div>
          <div class="stepper-row">
            <button class="step-btn" onclick="step('timerSec',-15,30,300)">−</button>
            <span class="step-val" id="v-timerSec">${S.timerSec}</span>
            <button class="step-btn" onclick="step('timerSec',15,30,300)">+</button>
          </div>
        </div>
      </div>

      <div class="slabel">الكاتيقوري</div>
      <div class="cat-scroll">${catsHtml}</div>

      <button class="btn btn-primary" onclick="beginGame()">ابدأ اللعبة 🎮</button>
    </div>
  `);
}

function step(key,d,mn,mx){
  S[key]=Math.min(mx,Math.max(mn,S[key]+d));
  const el=$id('v-'+key);
  if(el){el.textContent=S[key];el.style.animation='none';el.offsetHeight;el.style.animation='wordBounce .25s ease';}
}

function pickCat(el,cat){
  S.category=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

/* ══════════════════════════════════════
   GAME LOGIC
══════════════════════════════════════ */
function beginGame(){
  if(S.outsiders>=S.players){alert('المختلفين لازم يكونون أقل من اللاعبين!');return;}
  S.round=1;S.scores={};
  for(let i=1;i<=S.players;i++)S.scores[`اللاعب ${i}`]=0;
  startRound();
}

function startRound(){
  const pairs=CATS[S.category];
  const pair=pairs[Math.floor(Math.random()*pairs.length)];
  S.normalWord=pair[0];S.outsiderWord=pair[1];
  const idxs=shuffle([...Array(S.players).keys()]);
  S.outsiderIdxs=idxs.slice(0,S.outsiders);
  S.playerWords=Array.from({length:S.players},(_,i)=>S.outsiderIdxs.includes(i)?S.outsiderWord:S.normalWord);
  S.cur=0;S.revealed=false;
  showPlayer();
}

/* ══════════════════════════════════════
   PLAYER SCREEN
══════════════════════════════════════ */
function showPlayer(){
  S.screen='player';
  const pct=(S.cur/S.players*100).toFixed(0);
  const name=`اللاعب ${S.cur+1}`;
  const isOut=S.outsiderIdxs.includes(S.cur);
  const flipHtml=S.revealed?`
    <div class="reveal-card rc-shown" onclick="hideWord()">
      ${isOut?'<div class="outsider-glow"></div>':''}
      <div class="rcs-lbl">${isOut?'🕵️ أنت المختلف!':'🔐 كلمتك السرية'}</div>
      <div class="rcs-word">${S.playerWords[S.cur]}</div>
      <div class="rcs-hint">اضغط للإخفاء</div>
    </div>
  `:`
    <div class="reveal-card rc-hidden" onclick="revealWord()">
      <div class="rch-icon">👆</div>
      <div class="rch-text">اضغط لكشف كلمتك</div>
      <div class="rch-sub">تأكد إن غيرك ما يشوف الشاشة</div>
    </div>
  `;
  render(`
    <div class="card">
      <div class="flex-between mb16">
        <span class="pill pill-purple">جولة ${S.round}/${S.rounds}</span>
        <span class="pill pill-teal">${S.cur+1}/${S.players}</span>
      </div>
      <div class="prog-wrap">
        <div class="prog-meta"><span>تقدم اللاعبين</span><span>${pct}%</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="player-tag"><span class="pill pill-gold">🎯 دور</span></div>
      <div class="player-num">${name}</div>
      ${flipHtml}
      ${S.revealed?`<button class="btn btn-primary" onclick="nextPlayer()">${S.cur+1<S.players?'اللاعب التالي →':'ابدأ النقاش 🗣️'}</button>`:''}
    </div>
  `);
}

function revealWord(){S.revealed=true;showPlayer();}
function hideWord(){S.revealed=false;showPlayer();}
function nextPlayer(){S.cur++;S.revealed=false;if(S.cur>=S.players)showDiscussion();else showPlayer();}

/* ══════════════════════════════════════
   DISCUSSION SCREEN
══════════════════════════════════════ */
function showDiscussion(){
  S.screen='discussion';
  let time=S.timerSec;
  const hints=shuffle([...HINTS]).slice(0,8);
  const R=54,C=2*Math.PI*R;

  render(`
    <div class="card">
      <div class="flex-between mb16">
        <span class="pill pill-purple">جولة ${S.round}/${S.rounds}</span>
        <span class="pill pill-teal">🕵️ نقاش</span>
      </div>
      <div class="tc mb8" style="font-size:22px;font-weight:900;">وقت النقاش</div>
      <div class="tc mb20" style="font-size:14px;color:var(--t2);">كل لاعب يعطي تلميح — اكشفوا المختلف 😈</div>

      <div class="timer-section">
        <div class="timer-svg-wrap">
          <svg width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="9"/>
            <circle id="tc" cx="65" cy="65" r="${R}" fill="none" stroke="#2dd4bf" stroke-width="9"
              stroke-dasharray="${C.toFixed(2)} ${C.toFixed(2)}" stroke-linecap="round"
              style="transition:stroke-dasharray 1s linear,stroke .5s;"/>
          </svg>
          <div class="timer-inner">
            <div class="timer-num" id="tn">${time}</div>
            <div class="timer-lbl">ثانية</div>
          </div>
        </div>
      </div>

      <div class="slabel tc">💡 أفكار للتلميح</div>
      <div class="hints-grid">
        ${hints.map((h,i)=>`<button class="hint-item" onclick="this.classList.add('used')">${h}</button>`).join('')}
      </div>

      <button class="btn btn-danger" onclick="goReveal()">كشف المختلف 🎯</button>
      <button class="btn btn-ghost" onclick="addT()">+30 ثانية ⏱️</button>
    </div>
  `);

  window.addT=()=>{time+=30;};
  if(S.timerRef)clearInterval(S.timerRef);
  S.timerRef=setInterval(()=>{
    time--;
    const tn=$id('tn');if(tn)tn.textContent=time;
    const pct=Math.max(0,time/S.timerSec);
    const dash=(pct*C).toFixed(2);
    const col=time>S.timerSec*.4?'#2dd4bf':time>S.timerSec*.2?'#f5c842':'#ef4444';
    const tc=$id('tc');
    if(tc){tc.setAttribute('stroke-dasharray',`${dash} ${C.toFixed(2)}`);tc.setAttribute('stroke',col);}
    if(time<=0){clearInterval(S.timerRef);S.timerRef=null;goReveal();}
  },1000);
}

/* ══════════════════════════════════════
   REVEAL SCREEN
══════════════════════════════════════ */
function goReveal(){
  if(S.timerRef){clearInterval(S.timerRef);S.timerRef=null;}
  S.screen='reveal';
  window._votes=new Set();
  render(`
    <div class="card">
      <div class="flex-between mb16">
        <span class="pill pill-purple">جولة ${S.round}/${S.rounds}</span>
        <span class="pill" style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#f87171;">🎯 كشف</span>
      </div>
      <div class="tc" style="font-size:22px;font-weight:900;margin-bottom:18px;">من هو المختلف؟</div>

      ${S.outsiderIdxs.map(i=>`
        <div class="outsider-reveal">
          <div class="or-avatar">🕵️</div>
          <div>
            <div class="or-name">اللاعب ${i+1}</div>
            <div class="or-sub">كان عنده كلمة مختلفة!</div>
          </div>
        </div>
      `).join('')}

      <div class="words-grid">
        <div class="word-box wb-n">
          <div class="wb-lbl">الكلمة العادية</div>
          <div class="wb-val">${S.normalWord}</div>
        </div>
        <div class="word-box wb-o">
          <div class="wb-lbl">كلمة المختلف</div>
          <div class="wb-val">${S.outsiderWord}</div>
        </div>
      </div>

      <div class="vote-section">
        <div class="vote-title">👆 من اكتشف المختلف قبل الكشف؟</div>
        <div class="vote-grid">
          ${Array.from({length:S.players},(_,i)=>{
            if(S.outsiderIdxs.includes(i))return'';
            return`<button class="vote-btn" id="vb${i}" onclick="toggleV(${i})">اللاعب ${i+1}</button>`;
          }).join('')}
        </div>
      </div>

      <div class="info-box">
        ✅ من اكتشف المختلف = +2 نقطة لكل واحد<br>
        🕵️ مختلف ما اتكشف = +3 نقاط للمختلف<br>
        🎯 مختلف اتكشف ولكن خمّن الكلمة الصح = +1 نقطة
      </div>

      <button class="btn btn-gold" onclick="endRound()">تسجيل النتائج ✅</button>
    </div>
  `);
  window.toggleV=(i)=>{
    const b=$id('vb'+i);
    if(window._votes.has(i)){window._votes.delete(i);b.classList.remove('on');}
    else{window._votes.add(i);b.classList.add('on');}
  };
}

function endRound(){
  const caught=window._votes.size>0;
  window._votes.forEach(i=>{S.scores[`اللاعب ${i+1}`]+=2;});
  if(!caught)S.outsiderIdxs.forEach(i=>{S.scores[`اللاعب ${i+1}`]+=3;});
  if(S.round>=S.rounds)showFinalScores();
  else showScores();
}

/* ══════════════════════════════════════
   SCORES
══════════════════════════════════════ */
function showScores(){
  S.screen='scores';
  const sorted=Object.entries(S.scores).sort((a,b)=>b[1]-a[1]);
  const medals=['🥇','🥈','🥉'];
  render(`
    <div class="card">
      <div class="flex-between mb16">
        <span class="pill pill-purple">بعد جولة ${S.round}</span>
        <span class="pill pill-gold">🏆 النقاط</span>
      </div>
      <div class="score-list">
        ${sorted.map(([n,p],i)=>{
          const isOut=S.outsiderIdxs.includes(parseInt(n.replace('اللاعب ',''))-1);
          return`<div class="score-row ${i===0?'r1':''}">
            <div class="s-rank">${medals[i]||`${i+1}`}</div>
            <div class="s-name">${n} ${isOut?'🕵️':''}</div>
            <div class="s-pts">${p}</div>
          </div>`;
        }).join('')}
      </div>
      <button class="btn btn-primary" onclick="nextRound()">الجولة التالية ${S.round+1}/${S.rounds} →</button>
      <button class="btn btn-ghost" onclick="showSetup()">إعادة من البداية</button>
    </div>
  `);
}

function showFinalScores(){
  S.screen='final';
  const sorted=Object.entries(S.scores).sort((a,b)=>b[1]-a[1]);
  const medals=['🥇','🥈','🥉'];
  fireConfetti();
  render(`
    <div class="winner-card">
      <span class="w-crown">👑</span>
      <div class="w-label">بطل اللعبة</div>
      <div class="w-name">${sorted[0][0]}</div>
      <div class="w-pts">${sorted[0][1]} نقطة</div>
    </div>
    <div class="card">
      <div class="tc mb16" style="font-size:18px;font-weight:900;">🏆 الترتيب النهائي</div>
      <div class="score-list">
        ${sorted.map(([n,p],i)=>
          `<div class="score-row ${i===0?'r1':''}">
            <div class="s-rank">${medals[i]||`${i+1}`}</div>
            <div class="s-name">${n}</div>
            <div class="s-pts">${p}</div>
          </div>`
        ).join('')}
      </div>
      <button class="btn btn-gold" onclick="showSetup()">🎮 لعبة جديدة</button>
    </div>
  `);
}

function nextRound(){S.round++;startRound();}

/* ══════════════════════════════════════
   CONFETTI
══════════════════════════════════════ */
function fireConfetti(){
  const wrap=$id('confetti');wrap.innerHTML='';
  const cols=['#f5c842','#ff6b35','#9b6dff','#2dd4bf','#ef4444','#fff','#ff3cac'];
  for(let i=0;i<80;i++){
    const d=document.createElement('div');
    d.className='dot';
    const size=Math.random()*10+5;
    d.style.cssText=`
      width:${size}px;height:${size}px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      left:${Math.random()*100}%;
      top:-20px;
      border-radius:${Math.random()>.5?'50%':'2px'};
      transform:rotate(${Math.random()*360}deg);
      animation:fall ${Math.random()*2+2}s ${Math.random()*1.5}s ease-in forwards;
    `;
    wrap.appendChild(d);
  }
  const style=document.createElement('style');
  style.textContent=`@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(${window.innerHeight+100}px) rotate(${Math.random()>0.5?'':'−'}720deg);}}`;
  document.head.appendChild(style);
  setTimeout(()=>wrap.innerHTML='',5000);
}

/* ══════════════════════════════════════
   BOOT
══════════════════════════════════════ */
showSetup();
</script>
