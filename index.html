<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>برا السالفة</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #050816;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      direction: rtl;
      color: white;
      position: relative;
      overflow-x: hidden;
    }
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, #7c3aed44, transparent 40%),
        radial-gradient(circle at 80% 80%, #06b6d444, transparent 40%),
        radial-gradient(circle at 50% 50%, #ec489944, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .container { width: 100%; max-width: 480px; position: relative; z-index: 2; }

    .card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px 24px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
    @keyframes popIn { from { transform: scale(0.6); opacity:0; } to { transform: scale(1); opacity:1; } }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }

    .title-main { font-size: 38px; margin-bottom: 8px; }
    .subtitle { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 24px; }

    .section { margin-bottom: 18px; text-align: right; }
    label { display:block; font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 8px; }

    input[type=number], select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 17px;
      outline: none;
      transition: border 0.2s;
    }
    input[type=number]:focus, select:focus { border-color: #7c3aed; }
    option { color: black; background: white; }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      color: white;
      font-size: 19px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      margin-top: 12px;
      font-family: inherit;
    }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(0.98); opacity:0.9; }
    .btn-ghost {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 16px;
    }
    .btn-danger { background: linear-gradient(135deg, #dc2626, #991b1b); }

    .player-header { font-size: 16px; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
    .player-name { font-size: 28px; font-weight: bold; margin-bottom: 20px; }

    .flip-card {
      height: 200px;
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: bold;
      margin: 20px 0;
      cursor: pointer;
      transition: transform 0.15s;
      user-select: none;
    }
    .flip-card:hover { transform: scale(1.02); }
    .flip-hidden {
      background: rgba(255,255,255,0.06);
      border: 2px dashed rgba(255,255,255,0.25);
      flex-direction: column;
      gap: 10px;
      font-size: 18px;
      color: rgba(255,255,255,0.6);
    }
    .flip-hidden .tap-icon { font-size: 36px; animation: pulse 2s infinite; }
    .flip-revealed {
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      animation: popIn 0.35s ease;
      flex-direction: column;
      gap: 10px;
    }
    .flip-revealed .word-label { font-size: 13px; opacity: 0.75; font-weight: normal; }
    .flip-revealed .word-main { font-size: 36px; }

    .progress-bar {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      height: 6px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      transition: width 0.4s ease;
    }

    .timer-ring {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }
    .timer-label { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

    .hints-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }
    .hint-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 12px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }
    .hint-card:hover { background: rgba(255,255,255,0.13); }
    .hint-used { opacity: 0.4; pointer-events: none; }

    .scoreboard {
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 16px;
      margin: 16px 0;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      font-size: 15px;
    }
    .score-row:last-child { border: none; }
    .score-badge {
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .reveal-section { margin: 16px 0; }
    .outsider-revealed {
      background: rgba(220, 38, 38, 0.2);
      border: 1px solid rgba(220, 38, 38, 0.4);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      animation: popIn 0.4s ease;
    }
    .outsider-icon { font-size: 32px; margin-bottom: 8px; }
    .outsider-name { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .outsider-word { font-size: 14px; color: rgba(255,255,255,0.6); }

    .words-reveal {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 16px 0;
    }
    .word-pill {
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
    }
    .word-normal { background: rgba(6,182,212,0.25); border: 1px solid #06b6d4; }
    .word-outsider { background: rgba(220,38,38,0.25); border: 1px solid #dc2626; }

    .round-badge {
      display: inline-block;
      background: rgba(124,58,237,0.3);
      border: 1px solid rgba(124,58,237,0.6);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .cat-tab {
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      color: white;
      font-family: inherit;
    }
    .cat-tab.active {
      background: rgba(124,58,237,0.4);
      border-color: #7c3aed;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="container" id="app"></div>

<script>
const CATEGORIES = {
  "🍔 أكل": [
    ["برجر","شاورما"], ["بيتزا","فطيرة"], ["كبسة","مندي"],
    ["قهوة","شاي"], ["دونات","كوكيز"], ["كولا","بيبسي"],
    ["سوشي","روبيان"], ["بطاطس مقلية","بطاطس مشوية"],
    ["آيس كريم","جيلاتو"], ["شوكولاته","كاراميل"],
    ["حليب","عصير برتقال"], ["تشيز كيك","تيراميسو"]
  ],
  "🚗 سيارات": [
    ["كامري","اكورد"], ["مرسيدس","لكزس"], ["ددسن","هايلكس"],
    ["موستنق","كامارو"], ["جي كلاس","رنج روفر"],
    ["لامبورغيني","فيراري"], ["بورش","ماكلارين"],
    ["تويوتا","هوندا"], ["BMW","اودي"]
  ],
  "🎮 ألعاب": [
    ["ماينكرافت","روبلوكس"], ["فالورانت","كود"],
    ["فيفا","بيس"], ["GTA","ريد ديد"],
    ["فورتنايت","ببجي"], ["ليق اوف ليجندز","دوتا 2"],
    ["أمينج أس","غاونتلت"], ["سبايدرمان","باتمان"]
  ],
  "⚽ كرة": [
    ["رونالدو","ميسي"], ["الهلال","النصر"],
    ["الاتحاد","الاهلي"], ["ريال مدريد","برشلونة"],
    ["ليفربول","مانشستر سيتي"], ["نيمار","مبابي"],
    ["التعاون","الفيحاء"]
  ],
  "🌍 أماكن": [
    ["مكة","المدينة"], ["الرياض","جدة"],
    ["دبي","أبوظبي"], ["القاهرة","الإسكندرية"],
    ["لندن","باريس"], ["طوكيو","سيول"],
    ["نيويورك","لوس أنجلوس"], ["البر","البحر"]
  ],
  "🎬 ترفيه": [
    ["نتفليكس","يوتيوب"], ["تيك توك","انستقرام"],
    ["سينما","مسرح"], ["بودكاست","راديو"],
    ["فيلم رعب","فيلم كوميدي"], ["مسلسل تركي","مسلسل أمريكي"]
  ],
  "😂 عشوائي": [
    ["ليل","نهار"], ["شتاء","صيف"],
    ["جوال","ايباد"], ["قلم","رصاص"],
    ["قطو","كلب"], ["طيارة","قطار"],
    ["كتاب","جريدة"], ["دش","حمام"],
    ["حذاء","صندل"], ["أرنب","سنجاب"]
  ]
};

const HINTS = [
  "قول كلمة واحدة وصف", "قول متى تستخدمه",
  "قول وين تلقاه", "قول كيف ريحته",
  "قول لونه", "قول شكله",
  "قول من يستخدمه", "قول كم يكلف تقريبًا"
];

let state = {
  screen: 'setup',
  players: 5,
  outsiderCount: 1,
  category: Object.keys(CATEGORIES)[0],
  round: 1,
  maxRounds: 3,
  scores: {},
  playerWords: [],
  outsiderIndices: [],
  currentPlayer: 0,
  revealed: false,
  timerValue: 90,
  timerInterval: null,
  usedHints: [],
  normalWord: '',
  outsiderWord: '',
};

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (state.screen === 'setup') renderSetup(app);
  else if (state.screen === 'player') renderPlayer(app);
  else if (state.screen === 'discussion') renderDiscussion(app);
  else if (state.screen === 'reveal') renderReveal(app);
  else if (state.screen === 'scores') renderScores(app);
}

function renderSetup(app) {
  const cats = Object.keys(CATEGORIES);
  app.innerHTML = `
    <div class="card">
      <div class="title-main">🎭 برا السالفة</div>
      <div class="subtitle">لعبة التجسس والكشف</div>
      <div class="section">
        <label>عدد اللاعبين (3-15)</label>
        <input type="number" id="s-players" min="3" max="15" value="${state.players}">
      </div>
      <div class="section">
        <label>عدد المختلفين (1-3)</label>
        <input type="number" id="s-outsiders" min="1" max="3" value="${state.outsiderCount}">
      </div>
      <div class="section">
        <label>عدد الجولات</label>
        <input type="number" id="s-rounds" min="1" max="10" value="${state.maxRounds}">
      </div>
      <div class="section">
        <label>وقت النقاش (ثانية)</label>
        <input type="number" id="s-timer" min="30" max="300" value="${state.timerValue}">
      </div>
      <div class="section">
        <label>الكاتيقوري</label>
        <div class="category-tabs" id="cat-tabs">
          ${cats.map(c => `<button class="cat-tab ${c===state.category?'active':''}" onclick="selectCat('${c}')">${c}</button>`).join('')}
        </div>
      </div>
      <button class="btn" onclick="startGame()">ابدأ اللعبة 🎮</button>
    </div>
  `;
}

function selectCat(cat) {
  state.category = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.textContent===cat));
}

function startGame() {
  const p = parseInt(document.getElementById('s-players').value);
  const o = parseInt(document.getElementById('s-outsiders').value);
  const r = parseInt(document.getElementById('s-rounds').value);
  const t = parseInt(document.getElementById('s-timer').value);
  if (o >= p) { alert('عدد المختلفين لازم يكون أقل من اللاعبين!'); return; }
  state.players = p;
  state.outsiderCount = o;
  state.maxRounds = r;
  state.timerValue = t;
  state.round = 1;
  state.scores = {};
  for (let i = 1; i <= p; i++) state.scores[`اللاعب ${i}`] = 0;
  startRound();
}

function startRound() {
  const catPairs = CATEGORIES[state.category];
  const pair = catPairs[Math.floor(Math.random() * catPairs.length)];
  state.normalWord = pair[0];
  state.outsiderWord = pair[1];

  const indices = Array.from({length: state.players}, (_,i)=>i);
  shuffle(indices);
  state.outsiderIndices = indices.slice(0, state.outsiderCount);

  state.playerWords = [];
  for (let i = 0; i < state.players; i++) {
    state.playerWords.push(state.outsiderIndices.includes(i) ? state.outsiderWord : state.normalWord);
  }

  state.currentPlayer = 0;
  state.revealed = false;
  state.screen = 'player';
  render();
}

function renderPlayer(app) {
  const total = state.players;
  const cur = state.currentPlayer + 1;
  const pct = ((cur-1)/total*100).toFixed(1);
  const name = `اللاعب ${cur}`;

  app.innerHTML = `
    <div class="card">
      <div class="round-badge">الجولة ${state.round} من ${state.maxRounds}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="player-header">دور</div>
      <div class="player-name">${name}</div>
      <div id="flip-area">
        ${state.revealed ? `
          <div class="flip-card flip-revealed" onclick="hideWord()">
            <div class="word-label">كلمتك السرية</div>
            <div class="word-main">${state.playerWords[state.currentPlayer]}</div>
            <div class="word-label" style="font-size:11px; margin-top:4px">اضغط للإخفاء</div>
          </div>
        ` : `
          <div class="flip-card flip-hidden" onclick="revealWord()">
            <div class="tap-icon">👆</div>
            <div>اضغط لكشف كلمتك</div>
          </div>
        `}
      </div>
      ${state.revealed ? `
        <button class="btn" onclick="nextPlayer()">
          ${cur < total ? `اللاعب التالي ←` : `ابدأ النقاش 🗣`}
        </button>
      ` : ''}
    </div>
  `;
}

function revealWord() { state.revealed = true; render(); }
function hideWord() { state.revealed = false; render(); }

function nextPlayer() {
  state.currentPlayer++;
  state.revealed = false;
  if (state.currentPlayer >= state.players) {
    state.screen = 'discussion';
    render();
  } else {
    render();
  }
}

function renderDiscussion(app) {
  let time = state.timerValue;
  const hints = [...HINTS].sort(() => Math.random()-0.5).slice(0, 6);
  const usedHints = new Set();

  function buildHtml(t) {
    const pct = t / state.timerValue * 100;
    const r = 44;
    const circ = 2 * Math.PI * r;
    const dash = (pct/100) * circ;
    const color = t > 30 ? '#06b6d4' : '#dc2626';
    return `
      <div class="card">
        <div class="round-badge">الجولة ${state.round} من ${state.maxRounds}</div>
        <h2 style="font-size:22px; margin-bottom:16px;">🕵️ وقت النقاش</h2>
        <p style="color:rgba(255,255,255,0.6); font-size:14px; margin-bottom:20px;">
          حاولوا تعرفون مين برا السالفة 😈<br>كل لاعب يعطي تلميح عن الكلمة
        </p>
        <div class="timer-ring">
          <svg width="110" height="110" viewBox="0 0 110 110">
            <circle cx="55" cy="55" r="${r}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="7"/>
            <circle cx="55" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="7"
              stroke-dasharray="${dash} ${circ}" stroke-linecap="round" style="transition:stroke-dasharray 1s linear"/>
          </svg>
          <div class="timer-text">
            <span id="timer-num">${t}</span>
            <span class="timer-label">ثانية</span>
          </div>
        </div>
        <p style="font-size:13px; color:rgba(255,255,255,0.5); margin-bottom:12px;">أفكار للتلميح (اضغط لاستخدامها)</p>
        <div class="hints-grid">
          ${hints.map((h,i)=>`<div class="hint-card" data-hint="${i}" id="hint-${i}">${h}</div>`).join('')}
        </div>
        <button class="btn btn-danger" onclick="goToReveal()" style="margin-bottom:8px">كشف المختلف 🎯</button>
        <button class="btn btn-ghost" onclick="addTime()">+30 ثانية ⏱</button>
      </div>
    `;
  }

  app.innerHTML = buildHtml(time);

  app.querySelectorAll('.hint-card').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.hint);
      if (!usedHints.has(i)) { usedHints.add(i); el.classList.add('hint-used'); }
    });
  });

  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    time--;
    if (time <= 0) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
      goToReveal();
      return;
    }
    const pct = time / state.timerValue * 100;
    const r = 44;
    const circ = 2 * Math.PI * r;
    const dash = (pct/100) * circ;
    const color = time > 30 ? '#06b6d4' : '#dc2626';
    const circle = app.querySelector('circle:last-child');
    if (circle) {
      circle.setAttribute('stroke-dasharray', `${dash} ${circ}`);
      circle.setAttribute('stroke', color);
    }
    const num = document.getElementById('timer-num');
    if (num) num.textContent = time;
  }, 1000);

  window.addTime = () => { time += 30; };
}

function goToReveal() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.screen = 'reveal';
  render();
}

function renderReveal(app) {
  const outsiderNames = state.outsiderIndices.map(i => `اللاعب ${i+1}`);
  app.innerHTML = `
    <div class="card">
      <div class="round-badge">الجولة ${state.round} من ${state.maxRounds}</div>
      <h2 style="font-size:22px; margin-bottom:8px;">🎯 الكشف</h2>
      <p style="color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:20px;">هذا كان المختلف!</p>
      <div class="reveal-section">
        ${outsiderNames.map(name => `
          <div class="outsider-revealed">
            <div class="outsider-icon">🕵️</div>
            <div class="outsider-name">${name}</div>
            <div class="outsider-word">كان عنده كلمة مختلفة</div>
          </div>
        `).join('')}
      </div>
      <div class="words-reveal">
        <div style="text-align:center">
          <div class="word-pill word-normal">${state.normalWord}</div>
          <div style="font-size:12px; margin-top:6px; color:rgba(255,255,255,0.5);">الكلمة العادية</div>
        </div>
        <div style="text-align:center">
          <div class="word-pill word-outsider">${state.outsiderWord}</div>
          <div style="font-size:12px; margin-top:6px; color:rgba(255,255,255,0.5);">كلمة المختلف</div>
        </div>
      </div>
      <div style="margin: 16px 0; padding: 14px; background: rgba(255,255,255,0.06); border-radius:16px;">
        <p style="font-size:14px; color:rgba(255,255,255,0.7); margin-bottom:12px;">من اكتشف المختلف؟</p>
        <div id="vote-area" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
          ${Array.from({length: state.players}, (_,i) => {
            if (state.outsiderIndices.includes(i)) return '';
            return `<button class="cat-tab" id="vote-${i}" onclick="toggleVote(${i})">اللاعب ${i+1}</button>`;
          }).join('')}
        </div>
      </div>
      <button class="btn" onclick="endRound()">تسجيل النتائج ✅</button>
    </div>
  `;

  window._votes = new Set();
  window.toggleVote = (i) => {
    const btn = document.getElementById(`vote-${i}`);
    if (window._votes.has(i)) { window._votes.delete(i); btn.classList.remove('active'); }
    else { window._votes.add(i); btn.classList.add('active'); }
  };
}

function endRound() {
  window._votes.forEach(i => {
    const name = `اللاعب ${i+1}`;
    state.scores[name] = (state.scores[name] || 0) + 2;
  });
  state.outsiderIndices.forEach(i => {
    if (window._votes.size === 0) {
      const name = `اللاعب ${i+1}`;
      state.scores[name] = (state.scores[name] || 0) + 3;
    }
  });
  state.screen = 'scores';
  render();
}

function renderScores(app) {
  const sorted = Object.entries(state.scores).sort((a,b) => b[1]-a[1]);
  const isLast = state.round >= state.maxRounds;

  app.innerHTML = `
    <div class="card">
      <h2 style="font-size:22px; margin-bottom:6px;">🏆 النقاط</h2>
      <div class="round-badge" style="margin-bottom:16px;">بعد الجولة ${state.round}</div>
      <div class="scoreboard">
        ${sorted.map(([name, score], idx) => {
          const medal = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'';
          const isOutsider = state.outsiderIndices.includes(parseInt(name.replace('اللاعب ',''))-1);
          return `
            <div class="score-row">
              <span>${medal} ${name} ${isOutsider?'🕵️':''}</span>
              <span class="score-badge">${score} نقطة</span>
            </div>
          `;
        }).join('')}
      </div>
      <div style="font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:16px; text-align:right; padding: 0 4px;">
        <div>🕵️ = كان مختلف هذي الجولة</div>
        <div style="margin-top:4px">من اكتشف المختلف = +2 نقطة | مختلف ما اتكشف = +3 نقاط</div>
      </div>
      ${isLast ? `
        <div style="background: rgba(124,58,237,0.2); border:1px solid rgba(124,58,237,0.4); border-radius:18px; padding:16px; margin-bottom:16px;">
          <div style="font-size:24px; margin-bottom:8px;">🎉</div>
          <div style="font-size:20px; font-weight:bold;">${sorted[0][0]} فاز!</div>
          <div style="font-size:14px; color:rgba(255,255,255,0.6);">${sorted[0][1]} نقطة</div>
        </div>
        <button class="btn" onclick="resetGame()">لعبة جديدة من البداية 🎮</button>
      ` : `
        <button class="btn" onclick="nextRound()">الجولة التالية ← (${state.round+1}/${state.maxRounds})</button>
        <button class="btn btn-ghost" onclick="resetGame()" style="margin-top:8px">لعبة جديدة من البداية</button>
      `}
    </div>
  `;
}

function nextRound() { state.round++; startRound(); }

function resetGame() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.screen = 'setup';
  render();
}

function shuffle(a) {
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

render();
</script>
</body>
</html>
